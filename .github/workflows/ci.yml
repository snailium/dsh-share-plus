name: CI

# The test gate that must stay green before a manual publish run. Publishing
# itself never happens here — see publish.yml (workflow_dispatch only).
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      # The repo is a pnpm workspace and ships pnpm-lock.yaml, not
      # package-lock.json, so the npm cache mode of setup-node cannot find a
      # lockfile to key on.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # The test script builds lib/ from src/ before running anything, so the
      # checked-in sources are the only input that matters.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test (build + typecheck + suites)
        run: pnpm test

      # Catches the classic packaging bugs: a `files` entry that omits a runtime
      # file, or a stray directory bloating the tarball.
      - name: Verify the tarball contents
        run: |
          set -euo pipefail
          npm pack --dry-run
          for needed in lib/index.js lib/client.js cordis.patch.yml README.md LICENSE; do
            npm pack --dry-run --json | node -e "
              const files = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].files.map((f) => f.path)
              if (!files.includes(process.argv[1])) { console.error('missing from tarball: ' + process.argv[1]); process.exit(1) }
            " "$needed"
          done
