<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root {
    --dsw-alias-border-l2: #d4d8de;
    --dsw-alias-label-primary: #1c1e21;
    --dsw-alias-label-secondary: #5f6368;
    --dsw-alias-label-dimmed: #9aa0a8;
    --dsw-alias-bg-mask-1: rgba(0,0,0,.4);
    --dsw-mask-blur: blur(2px);
    --dsw-alias-bg-layer-1: #f6f7f9;
    --dsw-alias-bg-layer-2: #ffffff;
    --dsw-alias-interactive-bg-hover: rgba(0,0,0,.06);
    --dsw-alias-button-primary-fill: #2563eb;
    --dsw-alias-label-primary-foreground: #ffffff;
    --dsw-alias-state-error-primary: #dc2626;
    --dsw-shadow-lv3: 0 12px 40px rgba(0,0,0,.25);
    --dsw-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--dsw-font-family); }

  .dshshare-overlay {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .dshshare-mask {
    position: absolute; inset: 0;
    background: var(--dsw-alias-bg-mask-1);
    backdrop-filter: var(--dsw-mask-blur);
  }
  .dshshare-card {
    position: relative; z-index: 1;
    background: var(--dsw-alias-bg-layer-2);
    color: var(--dsw-alias-label-primary);
    border: 1px solid var(--dsw-alias-border-l2);
    border-radius: 16px;
    width: 100%; max-width: 460px;
    box-shadow: var(--dsw-shadow-lv3);
    padding: 20px;
    font-family: var(--dsw-font-family);
    font-size: 14px;
  }
  .dshshare-card h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; color: var(--dsw-alias-label-primary); }
  .dshshare-card h4 { margin: 18px 0 8px; font-size: 13px; font-weight: 600; color: var(--dsw-alias-label-secondary); }
  .dshshare-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dshshare-expiry { display: flex; gap: 6px; flex-wrap: wrap; }
  .dshshare-seg {
    border: 1px solid var(--dsw-alias-border-l2);
    background: transparent; color: var(--dsw-alias-label-primary);
    border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .dshshare-seg-on {
    background: var(--dsw-alias-interactive-bg-hover);
    border-color: var(--dsw-alias-label-secondary);
  }
  .dshshare-primary {
    border: none;
    background: var(--dsw-alias-button-primary-fill);
    color: var(--dsw-alias-label-primary-foreground);
    border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .dshshare-ghost {
    border: 1px solid var(--dsw-alias-border-l2); background: transparent;
    color: var(--dsw-alias-label-primary); border-radius: 8px;
    padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .dshshare-url { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .dshshare-url input {
    flex: 1; min-width: 0;
    background: var(--dsw-alias-bg-layer-1);
    color: var(--dsw-alias-label-primary);
    border: 1px solid var(--dsw-alias-border-l2);
    border-radius: 6px; padding: 6px 8px; font-size: 12px;
    font-family: ui-monospace, Consolas, monospace;
  }
  .dshshare-url .tag { font-size: 11px; color: var(--dsw-alias-label-dimmed); min-width: 40px; }
  .dshshare-item {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--dsw-alias-border-l2);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
  }
  .dshshare-item .info { flex: 1; min-width: 0; }
  .dshshare-item .title {
    font-size: 13px; font-weight: 500; color: var(--dsw-alias-label-primary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dshshare-item .sub { font-size: 11px; color: var(--dsw-alias-label-dimmed); }
  .dshshare-close {
    position: absolute; top: 12px; right: 12px; border: none; background: transparent;
    color: var(--dsw-alias-label-secondary); font-size: 18px; cursor: pointer; line-height: 1;
  }
</style>
</head>
<body>
<div class="dshshare-overlay">
  <div class="dshshare-mask"></div>
  <div class="dshshare-card">
    <button class="dshshare-close">×</button>
    <h3>分享此会话</h3>
    <div class="dshshare-row">
      <span>有效期：</span>
      <div class="dshshare-expiry">
        <button class="dshshare-seg dshshare-seg-on">永不过期</button>
        <button class="dshshare-seg">1 小时</button>
        <button class="dshshare-seg">24 小时</button>
        <button class="dshshare-seg">7 天</button>
      </div>
    </div>
    <div class="dshshare-row">
      <button class="dshshare-primary">生成分享链接</button>
    </div>
    <h4>在局域网内其他设备打开以下链接即可查看（只读快照）：</h4>
    <div class="dshshare-url">
      <span class="tag">局域网</span>
      <input type="text" readonly value="http://192.168.1.20:3081/s/3f9a4b2c…">
      <button class="dshshare-ghost">复制</button>
      <button class="dshshare-ghost">打开</button>
    </div>
    <div class="dshshare-url">
      <span class="tag">本机</span>
      <input type="text" readonly value="http://127.0.0.1:3081/s/3f9a4b2c…">
      <button class="dshshare-ghost">复制</button>
      <button class="dshshare-ghost">打开</button>
    </div>
    <h4>已有的分享</h4>
    <div class="dshshare-item">
      <div class="info">
        <div class="title">用 Python 统计 CSV 分类并画柱状图</div>
        <div class="sub">长期有效</div>
      </div>
      <button class="dshshare-ghost">复制</button>
      <button class="dshshare-ghost">停止分享</button>
    </div>
  </div>
</div>
</body>
</html>
